<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Omada Analytics & Logs Template</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@chenyqthu/omada-ui-kit@0.6.0/dist/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@chenyqthu/omada-ui-kit@0.6.0/dist/standalone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.28.4/babel.min.js"></script>
  </head>
  <body style="margin: 0;">
    <div id="root"></div>
    <script type="text/babel">
      const { useMemo, useState } = OmadaUI.React;
      const {
        OmadaAgentProvider,
        OmadaProvider,
        SEmulatorShell,
        SPageHeader,
        SCategoryKpiCarousel,
        SDonutSummaryCard,
        SFilterTableBlock,
        STag,
        Row,
        Col,
        useOmadaAgentAction,
      } = window.OmadaUI;

      const LOG_ROWS = [
        { key: '1', time: '2026-11-21 15:24:10', category: 'wireless', severity: 'orange', event: 'High channel interference detected on EAP650-Lobby (Ch 36)' },
        { key: '2', time: '2026-11-21 15:18:02', category: 'auth', severity: 'green', event: 'WPA-Enterprise 802.1X RADIUS session renewed for Finance-MacBook' },
        { key: '3', time: '2026-11-21 14:55:41', category: 'wan', severity: 'red', event: 'WAN2 link jitter exceeded 80 ms threshold for 45s' },
      ];

      const VALID_CATEGORIES = new Set(['all', 'wireless', 'auth', 'wan']);

      function AnalyticsLogsDemo() {
        const [category, setCategory] = useState('all');
        const [search, setSearch] = useState('');

        useOmadaAgentAction({
          id: 'logs.selectCategory',
          label: 'Select Incident Category',
          description: 'Filters event timeline by category ("all", "wireless", "auth", "wan").',
          handler: (cat) => {
            const next = String(cat || '').trim().toLowerCase();
            if (!VALID_CATEGORIES.has(next)) {
              throw new Error(`Unknown category "${next}". Expected all, wireless, auth, or wan.`);
            }
            setCategory(next);
            return next;
          },
        });

        useOmadaAgentAction({
          id: 'logs.searchEvents',
          label: 'Search Event Timeline',
          description: 'Filters event messages by keyword substring.',
          handler: (q) => {
            const text = String(q || '');
            setSearch(text);
            return text;
          },
        });

        useOmadaAgentAction({
          id: 'logs.clearFilters',
          label: 'Clear All Log Filters',
          description: 'Resets category to "all" and clears search text.',
          handler: () => {
            setCategory('all');
            setSearch('');
            return { category: 'all', search: '' };
          },
        });

        const filtered = useMemo(
          () =>
            LOG_ROWS.filter((r) => {
              const matchCat = category === 'all' || r.category === category;
              const matchSearch = !search.trim() || r.event.toLowerCase().includes(search.toLowerCase());
              return matchCat && matchSearch;
            }),
          [category, search],
        );

        return (
          <SEmulatorShell activeKey="incidents" onSelect={() => {}} controllerName="Headquarters Building">
            <div style={{ padding: '20px 24px' }}>
              <div style={{ paddingRight: 20 }}>
                <SPageHeader title="Incident & Event Analytics" description="Intelligent correlation across wireless, auth, and WAN anomalies" />
              </div>

              <div className="pr-9" style={{ marginBottom: 16 }}>
                <SCategoryKpiCarousel
                  activeKey={category}
                  onSelect={setCategory}
                  items={[
                    { key: 'all', label: 'All Incidents', count: LOG_ROWS.length },
                    { key: 'wireless', label: 'RF & Wireless', count: 1 },
                    { key: 'auth', label: 'Authentication', count: 1 },
                    { key: 'wan', label: 'WAN & Uplink', count: 1 },
                  ]}
                />
              </div>

              <Row gutter={[16, 16]} style={{ marginBottom: 16 }}>
                <Col xs={24} lg={9}>
                  <SDonutSummaryCard
                    title="Severity Breakdown"
                    centerValue={String(LOG_ROWS.length)}
                    centerLabel="Events"
                    layout="horizontal"
                    data={[
                      { key: 'critical', label: 'Critical', value: 1, displayValue: '1' },
                      { key: 'warning', label: 'Warning', value: 1, displayValue: '1' },
                      { key: 'info', label: 'Info', value: 1, displayValue: '1' },
                    ]}
                  />
                </Col>
                <Col xs={24} lg={15}>
                  <SFilterTableBlock
                    agentId="logs.table"
                    title="Event Timeline"
                    searchPlaceholder="Filter event message"
                    searchValue={search}
                    onSearchChange={setSearch}
                    tableProps={{
                      rowKey: 'key',
                      dataSource: filtered,
                      pagination: false,
                      columns: [
                        { title: 'Time', dataIndex: 'time', key: 'time', width: 175 },
                        {
                          title: 'Level',
                          dataIndex: 'severity',
                          key: 'severity',
                          width: 110,
                          render: (c) => <STag color={c}>{c === 'red' ? 'Critical' : c === 'orange' ? 'Warning' : 'Normal'}</STag>,
                        },
                        { title: 'Message', dataIndex: 'event', key: 'event' },
                      ],
                    }}
                  />
                </Col>
              </Row>
            </div>
          </SEmulatorShell>
        );
      }

      OmadaUI.render(
        <OmadaProvider defaultThemeMode="light">
          <OmadaAgentProvider exposeWindowBridge>
            <AnalyticsLogsDemo />
          </OmadaAgentProvider>
        </OmadaProvider>,
        '#root',
      );
    </script>
  </body>
</html>
