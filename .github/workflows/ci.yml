name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (app, node, lib, templates)
        run: pnpm typecheck

      - name: Build library, standalone bundle, scoped CSS & catalog
        run: pnpm build:lib

      - name: Verify deterministic catalog & skill bundle sync
        run: |
          git diff --exit-code -- skills/ .agents/
          test -z "$(git ls-files --others --exclude-standard -- skills/ .agents/)"

      - name: Run unit test suite
        run: pnpm test

      - name: Run Agent readiness & verifier evaluation suite
        run: pnpm test:agent-eval

      - name: Build Showcase & Emulator app
        run: pnpm build:app
